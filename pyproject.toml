[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leviata-game"
version = "0.1.0"
description = "Simulador 2D de grande estratégia emergente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.14.1,<2",
    "pytest>=8.3.4,<9",
    "ruff>=0.9.2,<1",
]

[project.scripts]
leviata = "leviata.main:main"

[tool.setuptools.packages.find]
include = ["leviata*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["leviata"]
